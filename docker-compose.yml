services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  backend:
    build: ./backend
    restart: always
    command: sh -c "python manage.py migrate && python manage.py seed_data && python manage.py runserver 0.0.0.0:8000"
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/mobilestore
      - DEBUG=true
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=dev-only-change-this-secret-key-2026
      - ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    expose:
      - "5173"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mobilestore
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mobilestore"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  db_data:
